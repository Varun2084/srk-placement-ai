name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^APP_PORT=.*/APP_PORT=8080/" .env
      - name: Build and start (app + Postgres)
        run: docker compose up -d --build
      - name: Smoke test
        run: |
          for i in $(seq 1 60); do curl -fs localhost:8080/api/health && break; sleep 3; done
          TOKEN=$(curl -fs -X POST localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"tpo@srk.demo","password":"Srk@2026"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          curl -fs localhost:8080/api/drives -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json;d=json.load(sys.stdin);assert len(d)==4,d;print("drives ok")'
          curl -fs -X POST localhost:8080/api/drives/3/match -H "Authorization: Bearer $TOKEN"
          curl -fs localhost:8080/api/drives/3/queue -H "Authorization: Bearer $TOKEN" | python3 -c 'import sys,json;q=json.load(sys.stdin);assert q["items"] and q["items"][0]["result"];print("matching on Postgres ok")'
          curl -fs localhost:8080/ | grep -q "SRK Placement AI" && echo "frontend ok"
          bash deploy/backup.sh && ls -la backups
      - name: Logs on failure
        if: failure()
        run: docker compose logs
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: start.ps1 parses and creates a valid .env
        shell: powershell
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\start.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs.Count) { $errs; exit 1 }
          function RandHex($n) { -join ((1..$n) | ForEach-Object { '{0:x2}' -f (Get-Random -Maximum 256) }) }
          (Get-Content .env.example) -replace '^JWT_SECRET=.*', "JWT_SECRET=$(RandHex 32)" -replace '^POSTGRES_PASSWORD=.*', "POSTGRES_PASSWORD=$(RandHex 16)" -replace '^APP_PORT=.*', 'APP_PORT=8080' | Set-Content .env -Encoding ascii
          $e = Get-Content .env
          if (-not ($e -match '^JWT_SECRET=[0-9a-f]{64}$')) { "bad JWT"; exit 1 }
          if (-not ($e -match '^POSTGRES_PASSWORD=[0-9a-f]{32}$')) { "bad PG"; exit 1 }
          if (-not ($e -match '^APP_PORT=8080$')) { "bad port"; exit 1 }
          "launcher ok"
