services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: srk_placement
      POSTGRES_USER: srk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srk -d srk_placement"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://srk:${POSTGRES_PASSWORD:-change-me}@db:5432/srk_placement
      UPLOAD_DIR: /app/backend/uploads
    volumes: [uploads:/app/backend/uploads]
    ports: ["8000:8000"]

volumes:
  pgdata:
  uploads:
