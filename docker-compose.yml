services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: srk_placement
      POSTGRES_USER: srk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srk -d srk_placement"]
      interval: 5s
      retries: 10

  app:
    build: .
    image: srk-placement-ai:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://srk:${POSTGRES_PASSWORD}@db:5432/srk_placement
      UPLOAD_DIR: /app/backend/uploads
    volumes: [uploads:/app/backend/uploads]
    ports: ["${APP_PORT:-80}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: public HTTPS link without a static IP or router changes.
  # Enable with:  docker compose --profile tunnel up -d   (needs CLOUDFLARE_TUNNEL_TOKEN in .env)
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [app]

volumes:
  pgdata:
  uploads:
